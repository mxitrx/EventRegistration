<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechForward | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #050505; color: #E2E8F0; overflow-x: hidden; }
        .bg-grid { background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .glass-panel { background: rgba(15, 20, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* สไตล์ตารางแบบพรีเมียม */
        table { border-collapse: collapse; width: 100%; }
        th { background-color: rgba(255, 255, 255, 0.02); color: #94A3B8; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 16px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 16px; font-size: 0.875rem; transition: background-color 0.2s; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

        /* CSS เพิ่มลูกเล่น (Particles และ Animation) */
        .admin-particle {
            position: fixed; background: #06B6D4; border-radius: 50%;
            pointer-events: none; z-index: -5; animation: floatUp linear infinite; opacity: 0.2;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        @keyframes rowEntrance {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stat-card-hover { transition: transform 0.3s ease, border-color 0.3s ease; }
        .stat-card-hover:hover { transform: translateY(-3px); border-color: rgba(6, 182, 212, 0.5); }
    </style>
</head>
<body class="bg-grid min-h-screen">

    <!-- Topbar -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-lg flex items-center justify-center font-bold text-white shadow-[0_0_10px_rgba(6,182,212,0.5)]">TF</div>
                <span class="font-bold text-xl text-white">Admin Dashboard</span>
                <span class="hidden md:flex ml-3 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> LIVE
                </span>
            </div>
            <div class="flex gap-3">
                <button onclick="exportCSV()" class="hidden md:flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm transition border border-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV
                </button>
                <button onclick="fetchData()" class="flex items-center gap-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    รีเฟรช
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- แถวสถิติ (Stats Widgets) -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
            <div class="glass-panel p-5 rounded-2xl relative overflow-hidden stat-card-hover border border-transparent">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/20 rounded-full blur-xl"></div>
                <div class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">ยอดผู้เข้าร่วม (Pax)</div>
                <div class="text-3xl font-bold text-white flex items-end gap-2" id="statPax">0 <span class="text-sm font-normal text-gray-500 mb-1">คน</span></div>
            </div>
            
            <div class="glass-panel p-5 rounded-2xl relative overflow-hidden stat-card-hover border border-transparent">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/20 rounded-full blur-xl"></div>
                <div class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">ยอดขายรวม (Revenue)</div>
                <div class="text-3xl font-bold text-emerald-400" id="statRev">฿0</div>
            </div>
            
            <div class="glass-panel p-5 rounded-2xl stat-card-hover border border-transparent">
                <div class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Regular Pass</div>
                <div class="text-2xl font-bold text-cyan-400" id="statRegular">0</div>
            </div>
            
            <div class="glass-panel p-5 rounded-2xl stat-card-hover border border-transparent">
                <div class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">VIP Pass</div>
                <div class="text-2xl font-bold text-purple-400" id="statVIP">0</div>
            </div>

            <!-- กล่องสถิติเช็คอิน -->
            <div class="glass-panel p-5 rounded-2xl relative overflow-hidden stat-card-hover border border-transparent">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/20 rounded-full blur-xl"></div>
                <div class="text-emerald-400 text-xs font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> มาถึงแล้ว
                </div>
                <div class="text-3xl font-bold text-white flex items-end gap-2" id="statCheckIn">0 <span class="text-sm font-normal text-gray-500 mb-1">คน</span></div>
            </div>
        </div>

        <!-- แถวกราฟ และ ตารางค้นหา -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- กราฟสัดส่วนบัตร -->
            <div class="glass-panel p-6 rounded-2xl lg:col-span-1 flex flex-col justify-center items-center">
                <h3 class="text-sm font-medium text-gray-300 w-full text-left mb-4">สัดส่วนประเภทบัตร</h3>
                <div class="w-48 h-48">
                    <canvas id="ticketChart"></canvas>
                </div>
            </div>

            <!-- ส่วนของตารางข้อมูล -->
            <div class="glass-panel rounded-2xl lg:col-span-2 flex flex-col h-[600px]">
                <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 class="text-lg font-bold text-white">รายชื่อผู้ลงทะเบียน</h2>
                    <div class="relative w-full sm:w-64">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="ค้นหาชื่อ, อีเมล, บริษัท..." class="bg-[#050505] border border-gray-700 text-white pl-10 pr-4 py-2 rounded-lg text-sm focus:outline-none focus:border-cyan-500 w-full transition">
                    </div>
                </div>
                
                <div class="overflow-x-auto flex-grow">
                    <table id="dataTable" class="w-full">
                        <thead class="sticky top-0 bg-[#0A0D14]/90 backdrop-blur-sm z-10">
                            <tr>
                                <th>ผู้ลงทะเบียน</th>
                                <th>องค์กร/ตำแหน่ง</th>
                                <th>ประเภทบัตร</th>
                                <th>ยอดสุทธิ</th>
                                <th class="text-center border-l border-gray-800/50">สถานะเข้างาน</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" class="text-center py-20">
                                    <svg class="animate-spin h-8 w-8 text-cyan-500 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <span class="text-gray-400">กำลังดึงข้อมูลจาก Google Sheets...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 🚀 URL ของ Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzr6BFee63NXbie-BVb6DE1ZMyw0zN_RDXzqR7h008mg6HgG_Vr4NA_p2pvz_FQ61-A_Q/exec';
        
        let chartInstance = null;
        let globalData = []; 

        // 1. เพิ่ม Background Particles
        function initParticles() {
            for(let i=0; i<15; i++) {
                let p = document.createElement('div');
                p.className = 'admin-particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = Math.random() * 4 + 2 + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 10 + 5) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(p);
            }
        }

        // 2. แอนิเมชันนับตัวเลข
        function animateValue(id, start, end, duration, isCurrency = false) {
            const obj = document.getElementById(id);
            if(!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const currentVal = Math.floor(progress * (end - start) + start);
                
                if(isCurrency) {
                    obj.innerText = '฿' + currentVal.toLocaleString();
                } else if(id === 'statPax' || id === 'statCheckIn') {
                    obj.innerHTML = currentVal.toLocaleString() + ' <span class="text-sm font-normal text-gray-500 mb-1">คน</span>';
                } else {
                    obj.innerText = currentVal.toLocaleString();
                }
                
                if (progress < 1) window.requestAnimationFrame(step);
                else {
                    if(isCurrency) obj.innerText = '฿' + end.toLocaleString();
                    else if(id === 'statPax' || id === 'statCheckIn') obj.innerHTML = end.toLocaleString() + ' <span class="text-sm font-normal text-gray-500 mb-1">คน</span>';
                    else obj.innerText = end.toLocaleString();
                }
            };
            window.requestAnimationFrame(step);
        }

        // 3. ดึงข้อมูล (พร้อมระบบแจ้งเตือน Error ที่ชัดเจนขึ้น)
        function fetchData() {
            fetch(SCRIPT_URL)
                .then(async res => {
                    // ดึงข้อมูลดิบมาก่อนเพื่อเช็คว่าใช่ JSON ไหม
                    const text = await res.text();
                    try {
                        return JSON.parse(text); // พยายามแปลงเป็น JSON
                    } catch (e) {
                        console.error("ไม่ใช่ JSON! สิ่งที่เซิร์ฟเวอร์ตอบกลับมาคือ:", text);
                        throw new Error("สิทธิ์การเข้าถึง API ผิดพลาด (ตรวจสอบ Who has access ให้เป็น Anyone)");
                    }
                })
                .then(data => {
                    globalData = data;
                    processData(data);
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    document.getElementById('tableBody').innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-10 text-red-400">
                                <b class="text-lg">โหลดข้อมูลไม่สำเร็จ!</b><br>
                                <span class="text-sm text-gray-500">${err.message}</span><br>
                                <span class="text-xs text-gray-600 mt-2 block">กด F12 ไปที่ Console เพื่อดูรายละเอียดเพิ่มเติม</span>
                            </td>
                        </tr>`;
                });
        }

        // 4. ประมวลผลและสร้างตาราง
        // 4. ประมวลผลและสร้างตาราง
        function processData(data) {
            const tbody = document.getElementById('tableBody');
            
            if(data.length <= 1) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-20 text-gray-500">ยังไม่มีข้อมูลการลงทะเบียน</td></tr>';
                animateValue("statPax", 0, 0, 1000);
                animateValue("statRev", 0, 0, 1000, true);
                animateValue("statRegular", 0, 0, 1000);
                animateValue("statVIP", 0, 0, 1000);
                animateValue("statCheckIn", 0, 0, 1000);
                return;
            }

            const rows = data.slice(1).reverse();
            let totalPax = 0, totalRev = 0, countRegular = 0, countVIP = 0, countCheckIn = 0;
            tbody.innerHTML = '';

            rows.forEach((row, index) => {
                const realRowIndex = data.length - index; 
                const date = new Date(row[0]).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
                
                // ใส่ String() เพื่อป้องกัน Error หากข้อมูลบางช่องว่างเปล่า
                const name = String(row[1] || "-"), 
                      email = String(row[2] || "-"), 
                      phone = String(row[3] || "-"), 
                      company = String(row[4] || "-"), 
                      role = String(row[5] || "-");
                      
                const ticket = row[6] || "-";
                const pax = parseInt(row[7]) || 1;
                // ตัด workshop (row[8]) ออกไป
                const payment = row[9] || "-";
                const total = parseFloat(row[10]) || 0;
                const checkinTime = row[11]; 

                totalPax += pax;
                totalRev += total;
                if(ticket.includes('Regular')) countRegular += pax;
                if(ticket.includes('VIP') || ticket.includes('VVIP')) countVIP += pax;
                
                const isArrived = checkinTime && checkinTime.trim() !== "";
                if(isArrived) countCheckIn += pax;

                // ป้ายประเภทบัตร
                let ticketBadge = `<span class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider shadow-[0_0_8px_rgba(6,182,212,0.2)]">${ticket}</span>`;
                if(ticket.includes('VIP')) ticketBadge = `<span class="bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider shadow-[0_0_8px_rgba(168,85,247,0.2)]">${ticket}</span>`;

                // ข้อมูลช่องทางชำระเงิน
                let paymentText = `<div class="mt-2 text-[10px] text-gray-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg> ${payment}</div>`;

                // ระบบ Check-in UI
                let checkinHTML = '';
                if(isArrived) {
                    checkinHTML = `
                        <div class="inline-flex flex-col items-center">
                            <div class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center gap-1 mb-1 shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> CHECKED-IN
                            </div>
                            <span class="text-[9px] text-gray-500">${checkinTime}</span>
                        </div>`;
                } else {
                    const safeName = name.replace(/'/g, "\\'");
                    checkinHTML = `
                        <button onclick="manualCheckIn(${realRowIndex}, '${safeName}')" class="text-[10px] font-bold text-gray-900 bg-cyan-500 hover:bg-cyan-400 transition px-3 py-1.5 rounded shadow-[0_0_10px_rgba(6,182,212,0.3)] flex items-center gap-1 mx-auto hover:scale-105 transform">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ติ๊กเข้างาน
                        </button>`;
                }

                const tr = document.createElement('tr');
                tr.style.animation = `rowEntrance 0.3s ease-out forwards ${index * 0.05}s`;
                tr.className = "opacity-0"; 
                tr.innerHTML = `
                    <td>
                        <div class="font-medium text-white">${name}</div>
                        <div class="text-xs text-gray-400 mt-1">${email}</div>
                        <div class="text-xs text-gray-500">${phone}</div>
                    </td>
                    <td>
                        <div class="text-gray-300 font-medium">${company}</div>
                        <div class="text-xs text-cyan-500/80 mt-1 bg-cyan-900/20 px-2 py-0.5 rounded inline-block border border-cyan-900/30">${role}</div>
                        ${paymentText}
                    </td>
                    <td>
                        <div class="mb-1">${ticketBadge} <span class="text-[10px] text-gray-400 ml-1">x<b class="text-white">${pax}</b></span></div>
                    </td>
                    <td>
                        <div class="font-bold text-emerald-400 text-base">฿${total.toLocaleString()}</div>
                        <div class="text-[10px] text-gray-500 mt-1">${date}</div>
                    </td>
                    <td class="text-center align-middle border-l border-gray-800/50">
                        ${checkinHTML}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // อัปเดตสถิติ
            animateValue("statPax", 0, totalPax, 1000);
            animateValue("statRev", 0, totalRev, 1000, true);
            animateValue("statRegular", 0, countRegular, 1000);
            animateValue("statVIP", 0, countVIP, 1000);
            animateValue("statCheckIn", 0, countCheckIn, 1000);

            // อัปเดตกราฟโดนัท
            const ctx = document.getElementById('ticketChart').getContext('2d');
            if(window.chartInstance) window.chartInstance.destroy(); 
            
            window.chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Regular/Online', 'VIP/VVIP'],
                    datasets: [{
                        data: [countRegular, countVIP],
                        backgroundColor: ['#06B6D4', '#A855F7'],
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '75%',
                    plugins: { legend: { display: false } },
                    animation: { duration: 1500, easing: 'easeOutQuart' }
                }
            });
        }

        // 5. ค้นหาในตาราง
        function searchTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const tr = document.getElementById("tableBody").getElementsByTagName("tr");
            
            for (let i = 0; i < tr.length; i++) {
                const text = tr[i].innerText.toLowerCase();
                tr[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        // 6. Export CSV
        function exportCSV() {
            if(globalData.length <= 1) return alert('ไม่มีข้อมูลให้ Export');
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            globalData.forEach(rowArray => {
                let row = rowArray.map(item => `"${item}"`).join(",");
                csvContent += row + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Summit_Registrations_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 7. ฟังก์ชันเช็คอินเข้าระบบ (ส่ง API)
        function manualCheckIn(rowIndex, name) {
            Swal.fire({
                title: 'ติ๊กเข้างาน?',
                html: `ยืนยันว่า <b class="text-cyan-400">${name}</b><br>มาถึงหน้างานแล้วใช่หรือไม่?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#06B6D4',
                cancelButtonColor: '#374151',
                confirmButtonText: 'ยืนยันการเข้างาน',
                cancelButtonText: 'ยกเลิก',
                background: '#0F172A',
                color: '#fff'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'กำลังอัปเดตระบบ...',
                        allowOutsideClick: false,
                        background: '#0F172A', color: '#fff',
                        didOpen: () => { Swal.showLoading() }
                    });
                    
                    const formData = new URLSearchParams();
                    formData.append('action', 'checkin_manual');
                    formData.append('rowIndex', rowIndex);
                    
                    fetch(SCRIPT_URL, { method: 'POST', body: formData })
                        .then(res => res.json())
                        .then(res => {
                            if(res.status === 'success') {
                                Swal.fire({ title: 'เช็คอินเรียบร้อย!', icon: 'success', background: '#0F172A', color: '#fff', timer: 1500, showConfirmButton: false });
                                fetchData(); // โหลดข้อมูลตารางใหม่
                            }
                        })
                        .catch(err => {
                            Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้', icon: 'error', background: '#0F172A', color: '#fff' });
                        });
                }
            });
        }

        // เริ่มต้นการทำงาน
        window.onload = () => {
            initParticles();
            fetchData();
        };
    </script>
</body>
</html>
