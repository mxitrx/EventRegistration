<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechForward | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- [NEW] นำเข้า AOS สำหรับลูกเล่นการโผล่ขึ้นมา -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #050505; color: #E2E8F0; overflow-x: hidden; }
        .bg-grid { background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .glass-panel { background: rgba(15, 20, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* สไตล์ตารางแบบพรีเมียม */
        table { border-collapse: collapse; width: 100%; }
        th { background-color: rgba(255, 255, 255, 0.02); color: #94A3B8; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 16px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 16px; font-size: 0.875rem; transition: background-color 0.2s; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.04); cursor: pointer; }
        
        /* [NEW] ลูกเล่น Effect เพิ่มเติม */
        .hover-glow:hover { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); border-color: rgba(6, 182, 212, 0.5); transform: translateY(-2px); transition: all 0.3s ease; }
        .text-gradient { background: linear-gradient(135deg, #A855F7, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Custom Scrollbar สำหรับตาราง */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(6,182,212,0.6); }
    </style>
</head>
<body class="bg-grid min-h-screen">

    <!-- Topbar -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-gray-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-lg flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(6,182,212,0.6)]">TF</div>
                <span class="font-bold text-xl text-white tracking-wide">Admin <span class="text-cyan-400">Dashboard</span></span>
                <span class="hidden md:flex ml-3 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 items-center gap-1 shadow-[0_0_8px_rgba(16,185,129,0.3)]">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> LIVE
                </span>
            </div>
            <div class="flex gap-3">
                <button onclick="exportCSV()" class="hidden md:flex items-center gap-2 bg-[#0A0D14] hover:bg-gray-800 text-gray-300 px-4 py-2 rounded-lg text-sm transition border border-gray-700 hover:border-cyan-500/50">
                    <svg class="w-4 h-4 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV
                </button>
                <button onclick="fetchData()" id="refreshBtn" class="flex items-center gap-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-[0_0_15px_rgba(6,182,212,0.4)] hover:scale-105 transform">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>รีเฟรช</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- แถวสถิติ (Stats Widgets) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
            <div class="glass-panel hover-glow p-5 rounded-2xl relative overflow-hidden" data-aos="fade-up" data-aos-delay="100">
                <div class="absolute -right-4 -top-4 w-20 h-20 bg-blue-500/20 rounded-full blur-2xl"></div>
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    ยอดผู้เข้าร่วม (Pax)
                </div>
                <div class="text-4xl font-black text-white flex items-baseline gap-2" id="statPax">0 <span class="text-sm font-normal text-gray-500">คน</span></div>
            </div>
            
            <div class="glass-panel hover-glow p-5 rounded-2xl relative overflow-hidden" data-aos="fade-up" data-aos-delay="200">
                <div class="absolute -right-4 -top-4 w-20 h-20 bg-emerald-500/20 rounded-full blur-2xl"></div>
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ยอดขายรวม (Revenue)
                </div>
                <div class="text-4xl font-black text-emerald-400" id="statRev">฿0</div>
            </div>
            
            <div class="glass-panel hover-glow p-5 rounded-2xl relative overflow-hidden" data-aos="fade-up" data-aos-delay="300">
                <div class="absolute right-0 top-0 w-1 bg-cyan-500 h-full"></div>
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                    Regular Pass
                </div>
                <div class="text-3xl font-bold text-white" id="statRegular">0</div>
            </div>
            
            <div class="glass-panel hover-glow p-5 rounded-2xl relative overflow-hidden" data-aos="fade-up" data-aos-delay="400">
                <div class="absolute right-0 top-0 w-1 bg-purple-500 h-full"></div>
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                    VIP Pass
                </div>
                <div class="text-3xl font-bold text-white" id="statVIP">0</div>
            </div>
        </div>

        <!-- แถวกราฟ และ ตารางค้นหา -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- กราฟสัดส่วนบัตร -->
            <div class="glass-panel p-6 rounded-2xl lg:col-span-1 flex flex-col justify-center items-center" data-aos="fade-right">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider w-full text-left mb-6 border-b border-gray-800 pb-2">สัดส่วนประเภทบัตร</h3>
                <div class="w-56 h-56 relative">
                    <!-- Text ตรงกลางกราฟโดนัท -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-xs text-gray-500">ทั้งหมด</span>
                        <span class="text-xl font-bold text-white" id="chartTotalText">0</span>
                    </div>
                    <canvas id="ticketChart"></canvas>
                </div>
                <!-- Legend ใต้กราฟ -->
                <div class="w-full mt-6 flex justify-center gap-6 text-xs text-gray-400">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#06B6D4]"></span>Regular</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#A855F7]"></span>VIP</div>
                </div>
            </div>

            <!-- ส่วนของตารางข้อมูล -->
            <div class="glass-panel rounded-2xl lg:col-span-2 flex flex-col h-[600px] border-t-2 border-t-cyan-500" data-aos="fade-left">
                <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gradient-to-r from-cyan-900/10 to-transparent rounded-t-2xl">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        รายชื่อผู้ลงทะเบียน
                    </h2>
                    <div class="relative w-full sm:w-64 group">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-500 group-focus-within:text-cyan-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="ค้นหาชื่อ, อีเมล, บริษัท..." class="bg-[#050505] border border-gray-700 text-white pl-10 pr-4 py-2 rounded-lg text-sm focus:outline-none focus:border-cyan-500 focus:shadow-[0_0_10px_rgba(6,182,212,0.3)] w-full transition-all">
                    </div>
                </div>
                
                <div class="overflow-x-auto flex-grow relative">
                    <table id="dataTable" class="w-full">
                        <thead class="sticky top-0 bg-[#0A0D14]/95 backdrop-blur-md z-10 shadow-sm">
                            <tr>
                                <th>ผู้ลงทะเบียน</th>
                                <th>องค์กร/ตำแหน่ง</th>
                                <th>ประเภทบัตร</th>
                                <th>ยอดสุทธิ</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- State: กำลังโหลด -->
                            <tr>
                                <td colspan="4" class="text-center py-32">
                                    <div class="flex flex-col items-center justify-center">
                                        <div class="relative w-16 h-16 mb-4">
                                            <div class="absolute inset-0 border-4 border-gray-800 rounded-full"></div>
                                            <div class="absolute inset-0 border-4 border-cyan-500 rounded-full border-t-transparent animate-spin"></div>
                                        </div>
                                        <span class="text-cyan-400 font-medium tracking-wide">กำลังเชื่อมต่อฐานข้อมูล...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 🚀 Initialize AOS Animation
        AOS.init();

        // 🚀 URL ของ Google Apps Script (ใส่ลิงก์ของคุณที่นี่)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFnp09VDXGq1sQuV9YYFbi5-vxYe_Lp3EASi85FLDlgYIkgo72H3Z2iltPICm9RviaUQ/exec';
        
        let chartInstance = null;
        let globalData = []; // เก็บข้อมูลสำหรับ Export CSV

        // เอฟเฟกต์การนับตัวเลขวิ่ง (Number Counter Animation)
        function animateValue(id, start, end, duration, isCurrency = false) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease out
                const currentVal = Math.floor(progress * (end - start) + start);
                
                if(isCurrency) {
                    obj.innerText = `฿${currentVal.toLocaleString()}`;
                } else {
                    obj.innerHTML = `${currentVal.toLocaleString()} ${id === 'statPax' ? '<span class="text-sm font-normal text-gray-500 mb-1">คน</span>' : ''}`;
                }
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    // Force exact final value
                    if(isCurrency) obj.innerText = `฿${end.toLocaleString()}`;
                    else obj.innerHTML = `${end.toLocaleString()} ${id === 'statPax' ? '<span class="text-sm font-normal text-gray-500 mb-1">คน</span>' : ''}`;
                }
            };
            window.requestAnimationFrame(step);
        }

        function fetchData() {
            const btn = document.getElementById('refreshBtn');
            const btnContent = btn.innerHTML;
            
            // เปลี่ยนปุ่มเป็นสถานะโหลด
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>กำลังโหลด</span>`;
            btn.disabled = true;

            // รีเซ็ตตารางให้โชว์ Loading
            document.getElementById('tableBody').innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-32">
                        <div class="flex flex-col items-center justify-center">
                            <div class="relative w-12 h-12 mb-4">
                                <div class="absolute inset-0 border-4 border-gray-800 rounded-full"></div>
                                <div class="absolute inset-0 border-4 border-cyan-500 rounded-full border-t-transparent animate-spin"></div>
                            </div>
                            <span class="text-cyan-400 font-medium tracking-wide">กำลังอัปเดตข้อมูล...</span>
                        </div>
                    </td>
                </tr>
            `;

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    processData(data);
                })
                .catch(err => {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" class="text-center py-20 text-red-400"><div class="flex flex-col items-center"><svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่</div></td></tr>';
                })
                .finally(() => {
                    // คืนค่าปุ่มรีเฟรชกลับ
                    btn.innerHTML = btnContent;
                    btn.disabled = false;
                });
        }

        function processData(data) {
            const tbody = document.getElementById('tableBody');
            
            if(data.length <= 1) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-20 text-gray-500 flex flex-col items-center"><svg class="w-12 h-12 mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>ยังไม่มีข้อมูลการลงทะเบียน</td></tr>';
                updateDashboard(0, 0, 0, 0);
                return;
            }

            const rows = data.slice(1).reverse(); // เรียงคนล่าสุดขึ้นก่อน
            let totalPax = 0, totalRev = 0, countRegular = 0, countVIP = 0;
            tbody.innerHTML = '';

            rows.forEach((row, index) => {
                // คอลัมน์อ้างอิง: [0:Time, 1:Name, 2:Email, 3:Phone, 4:Company, 5:Role, 6:Ticket, 7:Pax, 8:Workshop, 9:Payment, 10:Total]
                const dateObj = new Date(row[0]);
                const date = dateObj.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
                
                // ตรวจสอบว่าใช่วันนี้ไหม เพื่อใส่ Badge "NEW"
                const isToday = dateObj.toDateString() === new Date().toDateString();
                const newBadge = isToday && index < 3 ? `<span class="ml-2 bg-red-500/20 text-red-400 text-[9px] px-1.5 py-0.5 rounded uppercase font-bold animate-pulse">New</span>` : '';

                const name = row[1], email = row[2], phone = row[3], company = row[4], role = row[5];
                const ticket = row[6] || "-";
                const pax = parseInt(row[7]) || 1;
                const total = parseFloat(row[10]) || 0;

                // คำนวณสถิติ
                totalPax += pax;
                totalRev += total;
                if(ticket.includes('Regular')) countRegular += pax;
                if(ticket.includes('VIP')) countVIP += pax;

                // ตกแต่งป้ายชื่อบัตร (Badge)
                let ticketBadge = '';
                if(ticket.includes('VIP')) {
                    ticketBadge = `<span class="inline-flex items-center gap-1 bg-purple-500/10 text-purple-400 border border-purple-500/30 px-2.5 py-1 rounded text-xs font-bold uppercase shadow-[0_0_8px_rgba(168,85,247,0.2)]"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>${ticket}</span>`;
                } else {
                    ticketBadge = `<span class="inline-flex items-center gap-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-2.5 py-1 rounded text-xs font-bold uppercase"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>${ticket}</span>`;
                }

                // สร้างแถวตารางแบบมี Transition เฟดโชว์ทีละบรรทัด
                const tr = document.createElement('tr');
                tr.className = "opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]";
                tr.style.animationDelay = `${index * 0.05}s`; // ดีเลย์โชว์ทีละแถว
                
                tr.innerHTML = `
                    <td>
                        <div class="font-bold text-white flex items-center">${name} ${newBadge}</div>
                        <div class="text-xs text-gray-400 mt-1.5 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>${email}</div>
                        <div class="text-xs text-gray-500 mt-1 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>${phone}</div>
                    </td>
                    <td>
                        <div class="text-gray-200 font-medium">${company}</div>
                        <div class="text-xs text-cyan-500/80 mt-1.5 bg-cyan-900/20 px-2 py-0.5 rounded inline-block border border-cyan-900/30">${role}</div>
                    </td>
                    <td>
                        <div class="mb-2">${ticketBadge}</div>
                        <div class="text-[11px] text-gray-400 bg-gray-800/50 px-2 py-1 rounded inline-flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> <b>${pax}</b> ท่าน</div>
                    </td>
                    <td>
                        <div class="font-black text-lg text-emerald-400 tracking-tight">฿${total.toLocaleString()}</div>
                        <div class="text-[10px] text-gray-500 mt-1 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${date}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // ใส่ CSS Animation แบบ Custom สำหรับตาราง
            if (!document.getElementById('custom-keyframes')) {
                const style = document.createElement('style');
                style.id = 'custom-keyframes';
                style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;
                document.head.appendChild(style);
            }

            // อัปเดตตัวเลขด้วยเอฟเฟกต์นับขึ้น (Count Up)
            updateDashboard(totalPax, totalRev, countRegular, countVIP);
        }

        function updateDashboard(pax, rev, reg, vip) {
            // เรียกฟังก์ชันนับตัวเลขวิ่ง 1 วินาที (1000ms)
            animateValue("statPax", 0, pax, 1000);
            animateValue("statRev", 0, rev, 1000, true);
            animateValue("statRegular", 0, reg, 1000);
            animateValue("statVIP", 0, vip, 1000);
            
            document.getElementById('chartTotalText').innerText = pax; // อัปเดตเลขตรงกลางกราฟ

            // วาดกราฟโดนัท (Doughnut Chart) แบบพรีเมียม
            const ctx = document.getElementById('ticketChart').getContext('2d');
            
            // สร้าง Gradient สำหรับกราฟ
            const gradientReg = ctx.createLinearGradient(0, 0, 0, 200);
            gradientReg.addColorStop(0, '#06B6D4');
            gradientReg.addColorStop(1, '#3B82F6');
            
            const gradientVip = ctx.createLinearGradient(0, 0, 0, 200);
            gradientVip.addColorStop(0, '#A855F7');
            gradientVip.addColorStop(1, '#EC4899');

            if(chartInstance) chartInstance.destroy(); 
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Regular Pass', 'VIP Pass'],
                    datasets: [{
                        data: [reg, vip],
                        backgroundColor: [gradientReg, gradientVip],
                        borderWidth: 0,
                        hoverOffset: 8,
                        borderRadius: 5 // ขอบมน
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '80%', // วงกลมบางขึ้นดูทันสมัย
                    plugins: {
                        legend: { display: false },
                        tooltip: { 
                            theme: 'dark',
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: 'Kanit', size: 13 },
                            bodyFont: { family: 'Kanit', size: 14, weight: 'bold' },
                            padding: 12,
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            displayColors: true
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1500,
                        easing: 'easeOutQuart'
                    }
                }
            });
        }

        // ระบบค้นหาแบบ Highlight (Live Search)
        function searchTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const tr = document.getElementById("tableBody").getElementsByTagName("tr");
            let hasResult = false;
            
            // ลบข้อความ "ไม่พบข้อมูล" เก่าออกถ้ามี
            const noResultRow = document.getElementById('noResultRow');
            if(noResultRow) noResultRow.remove();

            for (let i = 0; i < tr.length; i++) {
                // ข้ามแถวที่เป็น Loading หรือ Empty State
                if(tr[i].id === 'noResultRow' || tr[i].cells.length === 1) continue; 
                
                const text = tr[i].innerText.toLowerCase();
                if(text.includes(input)) {
                    tr[i].style.display = "";
                    hasResult = true;
                } else {
                    tr[i].style.display = "none";
                }
            }
            
            // กรณีค้นหาแล้วไม่เจออะไรเลย
            if(!hasResult && input !== "" && document.getElementById("tableBody").innerHTML.trim() !== "") {
                const tbody = document.getElementById("tableBody");
                const newRow = document.createElement('tr');
                newRow.id = 'noResultRow';
                newRow.innerHTML = `<td colspan="4" class="text-center py-16 text-gray-500">ไม่พบข้อมูลที่ตรงกับ "${input}"</td>`;
                tbody.appendChild(newRow);
            }
        }

        // ฟังก์ชัน Export CSV
        function exportCSV() {
            if(globalData.length <= 1) return alert('ไม่มีข้อมูลให้ Export');
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // รองรับภาษาไทย (BOM)
            globalData.forEach(rowArray => {
                // ป้องกันปัญหาคอมม่าในข้อความ ด้วยการใส่ "" ครอบ
                let row = rowArray.map(item => `"${String(item).replace(/"/g, '""')}"`).join(",");
                csvContent += row + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            // ตั้งชื่อไฟล์ตามวันที่
            const today = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `TechForward_Registrations_${today}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
        window.onload = fetchData;
    </script>
</body>
